spring.application.name=api-gateway

# Route 0: auth-service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# Route 1: book-service
spring.cloud.gateway.server.webflux.routes[1].id=book-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://book-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/books/**

spring.cloud.gateway.server.webflux.routes[2].id=loan-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://loan-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/loans/**,/api/admin/loans/**


# Eureka Settings
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.server.enable-self-preservation=false

