server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
            - id: book-service
              uri: lb://book-service
              predicates:
                - Path=/api/books/**
            - id: loan-service
              uri: lb://loan-service
              predicates:
                - Path=/api/loans/**, /api/admin/loans/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address:true
  server:
    enableselfpreservation: false

app:
  jwt:
    secret: 0e3592d455427cdb7c0d84029f7ca6b70796ab84a385d6641550511963dccd5e
